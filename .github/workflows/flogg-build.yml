name: "Build"

on:
  push:
    branches: [ flogg, main, master ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'bench/**'
      - 'website/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'bench/**'
      - 'website/**'
  workflow_dispatch:

# A newer push to the same branch cancels the running build
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: windows-2022
    timeout-minutes: 120

    env:
      QT_VERSION: 6.7.3
      BOOST_VERSION: 1.86.0
      BUILD_ROOT: build_root

    steps:
      # The karchive patch is applied with git apply, keep LF line endings everywhere
      - name: Disable line ending conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Set version
        shell: bash
        run: |
          # CMake reads the build version from KLOGG_VERSION
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "KLOGG_VERSION=${GITHUB_REF_NAME#v}.${{ github.run_number }}" >> $GITHUB_ENV
            echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          else
            echo "KLOGG_VERSION=24.11.0.${{ github.run_number }}" >> $GITHUB_ENV
            echo "PACKAGE_VERSION=24.11.0.${{ github.run_number }}" >> $GITHUB_ENV
          fi

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2019_64
          modules: qt5compat
          archives: qtbase qtimageformats qtsvg qttools qttranslations icu
          cache: true

      # Hyperscan needs the boost headers
      - name: Restore Boost cache
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/boost
          key: boost-${{ env.BOOST_VERSION }}

      - name: Install Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: bash
        run: |
          version_underscore=${BOOST_VERSION//./_}
          curl --fail --location --silent --show-error --output boost.7z \
            "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${version_underscore}.7z"
          7z x boost.7z -bd -y > /dev/null
          mv "boost_${version_underscore}" boost
          rm boost.7z

      - name: Set Boost root
        shell: bash
        run: echo "BOOST_ROOT=${GITHUB_WORKSPACE//\\//}/boost" >> $GITHUB_ENV

      - name: Restore third party sources cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/cpm_cache
          key: cpm-${{ hashFiles('3rdparty/CMakeLists.txt', '3rdparty/patches/**') }}

      - name: Prepare MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B "$BUILD_ROOT" -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DKLOGG_GENERIC_CPU=ON
          -DKLOGG_USE_SENTRY=OFF
          -DKLOGG_OVERRIDE_MALLOC=OFF
          -DWARNINGS_AS_ERRORS=OFF
          -DCPM_SOURCE_CACHE="${GITHUB_WORKSPACE//\\//}/cpm_cache"

      - name: Build
        run: cmake --build ${{ env.BUILD_ROOT }} --target ci_build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir ${{ env.BUILD_ROOT }} --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $output = "$env:BUILD_ROOT\output"
          $release = "release\flogg"
          New-Item -ItemType Directory -Force $release | Out-Null

          foreach ($name in "flogg", "flogg_portable", "flogg_grep") {
            Copy-Item "$output\$name.exe" $release
          }

          # oneTBB is built as a dll in a compiler specific folder
          $tbb = Get-ChildItem $env:BUILD_ROOT -Recurse -Filter tbb12.dll | Select-Object -First 1
          if (-not $tbb) { throw "tbb12.dll not found" }
          Copy-Item $tbb.FullName $release

          windeployqt --release --no-translations --no-compiler-runtime `
            --no-system-d3d-compiler --no-system-dxc-compiler --no-opengl-sw `
            "$release\flogg.exe" "$release\flogg_portable.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }

          $crt = Join-Path $env:VCToolsRedistDir "x64\Microsoft.VC143.CRT"
          Copy-Item "$crt\*.dll" $release

          foreach ($doc in "COPYING", "NOTICE", "README.md") {
            Copy-Item $doc $release
          }

          $zip = "flogg-$env:PACKAGE_VERSION-windows-x64.zip"
          7z a -tzip $zip ".\release\flogg\*" | Out-Null
          7z a -tzip "flogg-$env:PACKAGE_VERSION-windows-x64-pdb.zip" "$output\*.pdb" | Out-Null

      # The pdb files stay in the build artifact, only the application goes to the release
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: flogg-windows-x64
          path: flogg-*-windows-x64*.zip
          if-no-files-found: error

  macos-arm64:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: macos-14
    timeout-minutes: 120

    env:
      QT_VERSION: 6.7.3
      BUILD_ROOT: build_root
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          # CMake reads the build version from KLOGG_VERSION
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "KLOGG_VERSION=${GITHUB_REF_NAME#v}.${{ github.run_number }}" >> $GITHUB_ENV
            echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          else
            echo "KLOGG_VERSION=24.11.0.${{ github.run_number }}" >> $GITHUB_ENV
            echo "PACKAGE_VERSION=24.11.0.${{ github.run_number }}" >> $GITHUB_ENV
          fi

      # Vectorscan needs ragel and the boost headers
      - name: Install build tools
        run: brew install ninja ragel boost pkgconf

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qt5compat
          archives: qtbase qtimageformats qtsvg qttools qttranslations
          cache: true

      - name: Restore third party sources cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/cpm_cache
          key: cpm-${{ runner.os }}-${{ hashFiles('3rdparty/CMakeLists.txt', '3rdparty/patches/**') }}

      - name: Configure
        run: >
          cmake -S . -B "$BUILD_ROOT" -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DKLOGG_OSX_DEPLOYMENT_TARGET=14.0
          -DKLOGG_USE_SENTRY=OFF
          -DWARNINGS_AS_ERRORS=OFF
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DCPM_SOURCE_CACHE="$GITHUB_WORKSPACE/cpm_cache"

      - name: Build
        run: cmake --build "$BUILD_ROOT" --target ci_build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir "$BUILD_ROOT" --output-on-failure

      - name: Package
        run: |
          app="$BUILD_ROOT/output/flogg.app"
          macdeployqt "$app" -always-overwrite

          # Not signed with a developer certificate: an ad-hoc signature is still needed to
          # run on Apple silicon, and macdeployqt changed the binaries
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"

          staging=dmg/flogg
          mkdir -p "$staging"
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"
          cp COPYING NOTICE README.md "$staging/"
          hdiutil create -volname flogg -srcfolder "$staging" -format UDZO -ov \
            "flogg-$PACKAGE_VERSION-macos-arm64.dmg"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: flogg-macos-arm64
          path: flogg-*-macos-arm64.dmg
          if-no-files-found: error

  # On a v* tag, one release with the packages of every platform, once they all built
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ windows-x64, macos-arm64 ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/flogg-*-windows-x64.zip
            packages/flogg-*-macos-arm64.dmg
