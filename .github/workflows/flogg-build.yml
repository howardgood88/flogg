name: "Build"

on:
  push:
    branches: [ flogg, main, master ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'bench/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'bench/**'
  workflow_dispatch:

# A newer push to the same branch cancels the running build
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: windows-2022
    timeout-minutes: 120

    env:
      QT_VERSION: 6.7.3
      BOOST_VERSION: 1.86.0
      BUILD_ROOT: build_root

    steps:
      # The karchive patch is applied with git apply, keep LF line endings everywhere
      - name: Disable line ending conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Set version
        shell: bash
        run: |
          # CMake reads the build version from KLOGG_VERSION
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "KLOGG_VERSION=${GITHUB_REF_NAME#v}.${{ github.run_number }}" >> $GITHUB_ENV
            echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          else
            echo "KLOGG_VERSION=24.11.0.${{ github.run_number }}" >> $GITHUB_ENV
            echo "PACKAGE_VERSION=24.11.0.${{ github.run_number }}" >> $GITHUB_ENV
          fi

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2019_64
          modules: qt5compat
          archives: qtbase qtimageformats qtsvg qttools qttranslations icu
          cache: true

      # Hyperscan needs the boost headers
      - name: Restore Boost cache
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/boost
          key: boost-${{ env.BOOST_VERSION }}

      - name: Install Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: bash
        run: |
          version_underscore=${BOOST_VERSION//./_}
          curl --fail --location --silent --show-error --output boost.7z \
            "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${version_underscore}.7z"
          7z x boost.7z -bd -y > /dev/null
          mv "boost_${version_underscore}" boost
          rm boost.7z

      - name: Set Boost root
        shell: bash
        run: echo "BOOST_ROOT=${GITHUB_WORKSPACE//\\//}/boost" >> $GITHUB_ENV

      - name: Restore third party sources cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/cpm_cache
          key: cpm-${{ hashFiles('3rdparty/CMakeLists.txt', '3rdparty/patches/**') }}

      - name: Prepare MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B "$BUILD_ROOT" -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DKLOGG_GENERIC_CPU=ON
          -DKLOGG_USE_SENTRY=OFF
          -DKLOGG_OVERRIDE_MALLOC=OFF
          -DWARNINGS_AS_ERRORS=OFF
          -DCPM_SOURCE_CACHE="${GITHUB_WORKSPACE//\\//}/cpm_cache"

      - name: Build
        run: cmake --build ${{ env.BUILD_ROOT }} --target ci_build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir ${{ env.BUILD_ROOT }} --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $output = "$env:BUILD_ROOT\output"
          $release = "release\flogg"
          New-Item -ItemType Directory -Force $release | Out-Null

          # flogg.exe keeps its settings next to itself, flogg_portable.exe would be the same
          Copy-Item "$output\flogg.exe" $release

          # oneTBB is built as a dll in a compiler specific folder
          $tbb = Get-ChildItem $env:BUILD_ROOT -Recurse -Filter tbb12.dll | Select-Object -First 1
          if (-not $tbb) { throw "tbb12.dll not found" }
          Copy-Item $tbb.FullName $release

          windeployqt --release --no-translations --no-compiler-runtime `
            --no-system-d3d-compiler --no-system-dxc-compiler --no-opengl-sw `
            "$release\flogg.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }

          $crt = Join-Path $env:VCToolsRedistDir "x64\Microsoft.VC143.CRT"
          Copy-Item "$crt\*.dll" $release

          foreach ($doc in "COPYING", "NOTICE", "README.md") {
            Copy-Item $doc $release
          }

          $zip = "flogg-$env:PACKAGE_VERSION-windows-x64.zip"
          7z a -tzip $zip ".\release\flogg\*" | Out-Null
          7z a -tzip "flogg-$env:PACKAGE_VERSION-windows-x64-pdb.zip" "$output\*.pdb" | Out-Null

      # The pdb files stay in the build artifact, only the application goes to the release
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: flogg-windows-x64
          path: flogg-*-windows-x64*.zip
          if-no-files-found: error

  # An AppImage: one file running on most distributions, built on an older Ubuntu so that it
  # runs on the newer ones
  linux-x64:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      QT_VERSION: 6.7.3
      BUILD_ROOT: build_root
      # The AppImage tools run without FUSE
      APPIMAGE_EXTRACT_AND_RUN: 1

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          # CMake reads the build version from KLOGG_VERSION
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "KLOGG_VERSION=${GITHUB_REF_NAME#v}.${{ github.run_number }}" >> $GITHUB_ENV
            echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          else
            echo "KLOGG_VERSION=24.11.0.${{ github.run_number }}" >> $GITHUB_ENV
            echo "PACKAGE_VERSION=24.11.0.${{ github.run_number }}" >> $GITHUB_ENV
          fi

      # Vectorscan needs ragel and the boost headers, the Qt xcb plugin the xcb libraries
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ragel libboost-dev \
            libgl1-mesa-dev libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libdbus-1-3 file

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qt5compat
          archives: qtbase qtimageformats qtsvg qttools qttranslations icu qtwayland
          cache: true

      - name: Restore third party sources cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/cpm_cache
          key: cpm-${{ runner.os }}-${{ hashFiles('3rdparty/CMakeLists.txt', '3rdparty/patches/**') }}

      - name: Configure
        run: >
          cmake -S . -B "$BUILD_ROOT" -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DKLOGG_GENERIC_CPU=ON
          -DKLOGG_USE_SENTRY=OFF
          -DWARNINGS_AS_ERRORS=OFF
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DCPM_SOURCE_CACHE="$GITHUB_WORKSPACE/cpm_cache"

      - name: Build
        run: cmake --build "$BUILD_ROOT" --target ci_build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir "$BUILD_ROOT" --output-on-failure

      - name: Package
        run: |
          tools=$RUNNER_TEMP/appimage-tools
          mkdir -p "$tools"
          for tool in linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
                      linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage \
                      linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage; do
            curl --fail --location --silent --show-error --output "$tools/$(basename "$tool")" \
              "https://github.com/$tool"
          done
          chmod +x "$tools"/*.AppImage
          export PATH="$tools:$PATH"

          appdir=AppDir
          mkdir -p "$appdir/usr/share/doc/flogg" "$appdir/usr/share/icons/hicolor/scalable/apps"
          cp COPYING NOTICE README.md "$appdir/usr/share/doc/flogg/"
          cp src/app/images/hicolor/scalable/flogg.svg \
            "$appdir/usr/share/icons/hicolor/scalable/apps/flogg.svg"

          # oneTBB is built as a shared library
          tbb=$(dirname "$(find "$BUILD_ROOT" -name 'libtbb.so*' | head -1)")
          export LD_LIBRARY_PATH="$tbb${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export EXTRA_PLATFORM_PLUGINS="libqwayland-generic.so"
          export LDAI_OUTPUT="flogg-$PACKAGE_VERSION-linux-x64.AppImage"
          export OUTPUT="$LDAI_OUTPUT"
          linuxdeploy-x86_64.AppImage --appdir "$appdir" \
            --executable "$BUILD_ROOT/output/flogg" \
            --desktop-file packaging/linux/flogg.desktop \
            --icon-file "$appdir/usr/share/icons/hicolor/scalable/apps/flogg.svg" \
            --plugin qt --output appimage
          test -f "$LDAI_OUTPUT"
          QT_QPA_PLATFORM=offscreen ./"$LDAI_OUTPUT" --version

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: flogg-linux-x64
          path: flogg-*-linux-x64.AppImage
          if-no-files-found: error

  # Not built for now: macOS runners are often not available for a long time. Remove
  # "false &&" to build the macOS package again (release-macos then adds it to releases)
  macos-arm64:
    if: "false && !contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: macos-15
    timeout-minutes: 120

    env:
      QT_VERSION: 6.7.3
      BUILD_ROOT: build_root
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          # CMake reads the build version from KLOGG_VERSION
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "KLOGG_VERSION=${GITHUB_REF_NAME#v}.${{ github.run_number }}" >> $GITHUB_ENV
            echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          else
            echo "KLOGG_VERSION=24.11.0.${{ github.run_number }}" >> $GITHUB_ENV
            echo "PACKAGE_VERSION=24.11.0.${{ github.run_number }}" >> $GITHUB_ENV
          fi

      # Vectorscan needs ragel and the boost headers
      - name: Install build tools
        run: brew install ninja ragel boost pkgconf

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qt5compat
          archives: qtbase qtimageformats qtsvg qttools qttranslations
          cache: true

      - name: Restore third party sources cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/cpm_cache
          key: cpm-${{ runner.os }}-${{ hashFiles('3rdparty/CMakeLists.txt', '3rdparty/patches/**') }}

      - name: Configure
        run: >
          cmake -S . -B "$BUILD_ROOT" -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DKLOGG_OSX_DEPLOYMENT_TARGET=14.0
          -DKLOGG_USE_SENTRY=OFF
          -DWARNINGS_AS_ERRORS=OFF
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DCPM_SOURCE_CACHE="$GITHUB_WORKSPACE/cpm_cache"

      - name: Build
        run: cmake --build "$BUILD_ROOT" --target ci_build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir "$BUILD_ROOT" --output-on-failure

      - name: Package
        run: |
          app="$BUILD_ROOT/output/flogg.app"
          macdeployqt "$app" -always-overwrite

          # Not signed with a developer certificate: an ad-hoc signature is still needed to
          # run on Apple silicon, and macdeployqt changed the binaries
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"

          staging=dmg/flogg
          mkdir -p "$staging"
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"
          cp COPYING NOTICE README.md "$staging/"
          hdiutil create -volname flogg -srcfolder "$staging" -format UDZO -ov \
            "flogg-$PACKAGE_VERSION-macos-arm64.dmg"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: flogg-macos-arm64
          path: flogg-*-macos-arm64.dmg
          if-no-files-found: error

  # On a v* tag, the release is made as soon as Windows built: macOS runners are often not
  # available for a long time. The other packages are added by release-linux and
  # release-macos when they built (also after "Re-run failed jobs")
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ windows-x64 ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Shown by the update dialog of flogg: the section of the version in CHANGELOG.md
      # ("## 1.2.0 (date)"), else the message of the annotated tag, else the commits since
      # the previous release
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          version="${GITHUB_REF_NAME#v}"
          message=$(awk -v version="$version" '
            /^## / { if (found) exit; found = ($2 == version) ; next }
            found { print }
          ' CHANGELOG.md)
          if [ -z "${message//[[:space:]]/}" ] \
             && [ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = "tag" ]; then
            message=$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")
          fi
          if [ -n "${message//[[:space:]]/}" ]; then
            printf '%s\n' "$message" > notes.md
          else
            previous=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)
            range="${GITHUB_REF_NAME}"
            if [ -n "$previous" ] && [ "$previous" != "${GITHUB_REF_NAME}" ]; then
              range="${previous}..${GITHUB_REF_NAME}"
            fi
            {
              echo "## Changes"
              git log --no-merges --format='- %s' "$range" | sed 's/^- flogg: /- /' | head -50
            } > notes.md
          fi
          cat notes.md

      - uses: actions/download-artifact@v4
        with:
          name: flogg-windows-x64
          path: packages

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: packages/flogg-*-windows-x64.zip

  release-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ release, linux-x64 ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flogg-linux-x64
          path: packages

      - name: Add the Linux package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "$GITHUB_REF_NAME" packages/flogg-*-linux-x64.AppImage
          --repo "$GITHUB_REPOSITORY" --clobber

  release-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ release, macos-arm64 ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flogg-macos-arm64
          path: packages

      - name: Add the macOS package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "$GITHUB_REF_NAME" packages/flogg-*-macos-arm64.dmg
          --repo "$GITHUB_REPOSITORY" --clobber
